name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Lint (ruff)
        run: uv run ruff check src/reinicorn tests

      - name: Type check (pyright)
        run: uv run pyright src/reinicorn

      # Coverage itself is configured in pyproject.toml (including the
      # fail_under floor). These flags only add the xml/html outputs the two
      # reporting steps below consume.
      - name: Run tests
        run: uv run pytest tests/ -v --cov-report=xml --cov-report=html
        env:
          GIT_ALLOW_PROTOCOL: "file:ext:https:http:ssh:git"

      # always(): the coverage table is most useful when the run just went
      # red on the threshold — that is when you want to see where the gap is.
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
