name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Clone kb
        run: git clone --depth 1 https://github.com/crystldm/reinicorn-kb.git kb

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      # The server-side kb boundary: .gitignore and the pre-commit hook are
      # client-side and bypassable (git add -f, --no-verify). Anything
      # tracked under kb/ — file or 160000 gitlink — fails the build.
      - name: Kb boundary check
        run: |
          tracked=$(git ls-files -- kb)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked paths under kb/ — the kb publishes via its own repo (rcorn kb publish):"
            echo "$tracked"
            exit 1
          fi

      - name: Lint (ruff)
        run: uv run ruff check src/reinicorn tests

      - name: Type check (pyright)
        run: uv run pyright src/reinicorn

      # Coverage itself is configured in pyproject.toml (including the
      # fail_under floor). These flags only add the xml/html outputs the two
      # reporting steps below consume.
      - name: Run tests
        run: uv run pytest tests/ -v --cov-report=xml --cov-report=html
        env:
          GIT_ALLOW_PROTOCOL: "file:ext:https:http:ssh:git"

      # always(): the coverage table is most useful when the run just went
      # red on the threshold — that is when you want to see where the gap is.
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
